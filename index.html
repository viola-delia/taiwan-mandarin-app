function startPlacement(){
  leaveHome();
  P={level:0,n:0,right:0,asked:0,passed:-1,items:null};
  top_.innerHTML=`<button class="icon-b" id="exit" aria-label="Leave the test" title="Leave the test">×</button><div class="prog" role="progressbar" aria-label="Test progress"><i id="prog"></i></div><button class="mode-btn" id="mode-btn" aria-label="Reading aids">拼 / 注</button>`;
  nextLevelItems(); ptShow();
}
function nextLevelItems(){ P.items=shuffle(PT[P.level]).slice(0,PER_LEVEL); P.n=0; P.right=0; }
function ptShow(){
  stopSpeaking(); applyMode();
  const it=P.items[P.n], listen=(P.asked%2===1);
  const others=shuffle(PT[P.level].filter(x=>x!==it)).slice(0,3).map(x=>x[2]);
  P.opts=shuffle([it[2],...others]); P.sel=null; P.cur=it;
  document.getElementById('prog').style.width=(P.level/6*100+(P.n/PER_LEVEL)*(100/6))+'%';
  stage.innerHTML=`
    <div class="eyebrow">${LEVELS[P.level][1]} · question ${P.asked+1}</div>
    <h2>${listen?'What do you hear?':'What does this mean?'}</h2>
    ${listen?`<div class="listen-row"><button class="listen-big" data-say="${it[0]}" aria-label="Play again">${ICON.spk}</button><button class="slow" data-say-slow="${it[0]}">Slower</button></div>`
            :`<div class="prompt-zh">${R(it[0],it[1])}</div>`}
    <div class="opts">${P.opts.map((o,i)=>`<button class="opt" data-pi="${i}" aria-pressed="false">${o}</button>`).join('')}</div>`;
  foot.className='foot';
  footIn.innerHTML=`<div class="foot-row"><button class="ghost" id="idk">I don’t know</button><button class="go" id="go" disabled>NEXT</button></div>`;
  document.getElementById('go').onclick=()=>ptAnswer(P.opts[P.sel]===it[2]);
  document.getElementById('idk').onclick=()=>ptAnswer(false);
  if(listen) setTimeout(()=>say(it[0]),350);
  window.scrollTo({top:0});
}
stage.addEventListener('click',e=>{
  if(!P||Q) return;
  const o=e.target.closest('[data-pi]'); if(!o) return;
  P.sel=+o.dataset.pi; stage.querySelectorAll('[data-pi]').forEach(b=>b.setAttribute('aria-pressed',b===o));
  document.getElementById('go').disabled=false;
});
function ptAnswer(ok){
  P.asked++; P.n++; if(ok) P.right++;
  const wrong=P.n-P.right, passed=P.right>=PASS, failed=wrong>=FAIL;
  if(passed||failed||P.n>=PER_LEVEL){
    if(passed){ P.passed=P.level; if(P.level<5){ P.level++; nextLevelItems(); return ptShow(); } }
    return ptResult();
  }
  ptShow();
}
function ptResult(){
  stopSpeaking();
  const rec=Math.min(5,P.passed+1);   // the first level you didn't pass is the one to study
  const beginner=P.passed<0;
  document.getElementById('prog').style.width='100%';
  stage.innerHTML=`<div class="finish">
    <div class="hero">${HELLO_ART}</div>
    <div class="eyebrow">Your result</div>
    <h1>${beginner?'Let’s start with the basics':'Your level: '+LEVELS[rec][1]}</h1>
    <p class="lead">${beginner?'The Novice words weren’t familiar yet, so the first lessons are the right place to start. They’re short.'
      :P.passed>=5?'You knew words from every level. Impressive! Level 5 stories and conversations are for you.'
      :`You know most words up to ${LEVELS[P.passed][1]}. ${LEVELS[rec][1]} is where you’ll learn the most.`}</p>
    <div class="ladder">${[0,1,2,3,4,5].map(l=>`<div class="rung${l<=P.passed?' ok':''}${l===rec&&!beginner||beginner&&l===0?' here':''}"><span>${LEVELS[l][1]}</span><small>${LEVELS[l][0]} · ${LEVELS[l][2]}</small><b>${l<=P.passed?'✓':l===rec&&!beginner||beginner&&l===0?'Start here':''}</b></div>`).join('')}</div>
    <button class="link" id="pick-level">Choose a different level</button>
  </div>`;
  LEVEL=beginner?0:rec; store.set('tw.level',LEVEL);
  foot.className='foot'; footIn.innerHTML=`<button class="go" id="go">${beginner?'START LESSON 1':'CONTINUE'}</button>`;
  document.getElementById('go').onclick=()=>{ P=null; beginner?startLesson(1):home(); };
  document.getElementById('pick-level').onclick=levelPicker;
  window.scrollTo({top:0});
}
function levelPicker(){
  leaveHome();
  stopSpeaking(); P=null; Q=null; applyMode(); topHome();
  let sel=LEVEL==null?0:LEVEL;
  stage.innerHTML=`
    <div class="eyebrow">Choose your level</div>
    <h1>Where do you want to start?</h1>
    <p class="lead">Levels follow Taiwan’s official TOCFL word list. You can change this any time.</p>
    <div class="choices">${[0,1,2,3,4,5].map(l=>`<button class="choice" data-lv="${l}" aria-pressed="${sel===l}"><span class="lv lvn">${l===0?'N':l}</span><b>${LEVELS[l][1]} · ${LEVELS[l][0]}</b><small>${LEVELS[l][2]} · ${['Your first 500 words','Everyday basics','Daily life with confidence','Work, news and opinions','Complex topics','Near-native'][l]}</small></button>`).join('')}</div>`;
  foot.className='foot'; footIn.innerHTML=`<button class="go" id="go">SAVE</button>`;
  stage.onclick=e=>{ const b=e.target.closest('[data-lv]'); if(!b) return; sel=+b.dataset.lv; stage.querySelectorAll('[data-lv]').forEach(x=>x.setAttribute('aria-pressed',x===b)); };
  document.getElementById('go').onclick=()=>{ stage.onclick=null; LEVEL=sel; store.set('tw.level',LEVEL); sel===0&&!DONE[1]?startLesson(1):home(); };
  window.scrollTo({top:0});
}

/* ---------- Lesson engine ---------- */
const isExercise=s=>!['learn'].includes(s.t);
const CHECKED=['tone','intro','meaning','gap','orderZh','orderEn','mcq','role','lq'];
function progress(){ const p=document.getElementById('prog'); if(!p) return;
  const f=finished?1:LID==='practice'&&LRN?LRN.items.filter(i=>i.done).length/LRN.items.length:qi/Q.length; p.style.width=(f*100)+'%'; }
function show(){
  stopSpeaking(); stopRec();
  cur={sel:null,picked:[],matched:0,checked:false,missed:false};
  const s=Q[qi]; progress(); applyMode(); writer=null;
  const bk=document.getElementById('back'); if(bk){ bk.hidden=LID==='practice'; bk.disabled=qi===0; }
  if(LID!=='practice'&&qi>0){ PARTIAL[LID]={qi,of:Q.length}; store.set('tw.partial',PARTIAL); }
  stage.innerHTML=VIEW[s.t](s);
  bindSegs();
  if(s.t==='write') setupWriter(s);
  if(['tone','orderZh','orderEn','intro'].includes(s.t)||(s.t==='mcq'&&s.say)||s.t==='role'||s.t==='lq') setTimeout(()=>say(s.t==='tone'?s.ch:s.t==='intro'?s.k:s.t==='role'?s.line:s.t==='lq'?s.it.zh:s.say),350);
  setFoot(CHECKED.includes(s.t)?'check':s.t==='match'?'match':s.t==='speak'?'speak':s.t==='write'?'write':'continue');
  window.scrollTo({top:0});
}
function setFoot(state,msg,quiet){
  foot.className='foot';
  if(state==='continue') footIn.innerHTML=`<button class="go" id="go">CONTINUE</button>`;
  else if(state==='check') footIn.innerHTML=`<div class="foot-row"><button class="ghost" id="reveal">Show answer</button><button class="go" id="go" disabled>CHECK</button></div>`;
  else if(state==='match') footIn.innerHTML=`<div class="foot-row"><button class="ghost" id="reveal">Show answer</button><p class="muted" style="align-self:center;font-size:14px">Tap a word, then its match.</p></div>`;
  else if(state==='speak') footIn.innerHTML=`<button class="skip" id="skip">I can’t speak right now</button>`;
  else if(state==='write') footIn.innerHTML=`<div class="foot-row"><button class="ghost" id="wskip">Skip</button><p class="muted" style="align-self:center;font-size:14px">${Q[qi].mode==='trace'?'Watch, then draw over the grey strokes.':'Draw it stroke by stroke.'}</p></div>`;
  else {
    foot.classList.add(state);
    if(!quiet) sfx(state==='ok'?'ok':state==='no'?'no':'');
    const head=state==='ok'?pick(['Nice!','Correct!','That’s it!','做得好！']):state==='shown'?'Here’s the answer':'Not quite';
    footIn.innerHTML=`<div class="fb"><b>${head}</b>${msg?`<span>${msg}</span>`:''}</div><button class="go" id="go">CONTINUE</button>`;
  }
  const go=document.getElementById('go'); if(go){ go.onclick=onGo; if(!go.disabled) go.focus({preventScroll:true}); }
  const rv=document.getElementById('reveal'); if(rv) rv.onclick=reveal;
  const sk=document.getElementById('skip'); if(sk) sk.onclick=()=>{ stopRec(); next(); };
  const sd=document.getElementById('said'); if(sd) sd.onclick=()=>next();
  const ws=document.getElementById('wskip'); if(ws) ws.onclick=()=>{ if(writer) try{writer.cancelQuiz()}catch(e){} next(); };
}
function enableCheck(on){ const g=document.getElementById('go'); if(g&&!cur.checked) g.disabled=!on; }
function onGo(){ const s=Q[qi]; if(CHECKED.includes(s.t)&&!cur.checked){ check(); return; } next(); }
function next(){ qi++; if(qi>=Q.length) finish(); else show(); }
function requeue(){ if(!Q[qi].copy&&!requeued.has(qi)){ requeued.add(qi); Q.push({...Q[qi],copy:true}); } }
function goBack(){ if(finished||qi<=0||LID==='practice') return; qi--; delete RES[qi]; show(); }
function result(ok,msg,shown){
  cur.checked=true;
  RES[qi]=ok; if(LID==='practice') learnAfter(ok); else if(!ok) requeue();
  stage.querySelectorAll('.opt,.tile,.mt').forEach(b=>b.disabled=true);
  setFoot(ok?'ok':shown?'shown':'no',msg);
  progress();
}

/* The right answer and its explanation, per exercise type */
function answerOf(s){
  if(s.t==='tone') return {i:cur.opts.indexOf(s.py),msg:`${s.ch} is ${rd(s.py)}, tone ${s.py.slice(-1)}.`};
  if(s.t==='intro') return {i:cur.opts.indexOf(s.k),msg:`${s.k} ${rd(V[s.k].py)} means “${V[s.k].en}”.`};
  if(s.t==='meaning') return {i:cur.opts.indexOf(s.opts[0]),msg:`${s.k} ${rd(V[s.k].py)} means “${s.opts[0]}”.`};
  if(s.t==='gap') return {i:cur.opts.indexOf(s.ans),msg:`${s.pre}${s.ans}${s.post} ${rd(s.py+' '+rdOf(s.ans)+(s.postPy?' '+s.postPy:''))} · ${s.en}`};
  if(s.t==='orderZh') return {msg:`${s.ans.join('')}。 ${rd(s.py)} · ${s.en}`};
  if(s.t==='orderEn') return {msg:`${s.say}？ means “${s.ans.join(' ')}?”`};
  if(s.t==='lq') return {i:cur.opts.indexOf(s.it),msg:`${s.it.zh} ${rd(s.it.py)} · ${s.it.en}`};
  if(s.t==='mcq'){ const o=s.opts[s.ans]; return {i:cur.opts.indexOf(s.ans),msg:(Array.isArray(o)?`${o[0]} ${rd(o[1])}. `:`“${o}” `)+s.why}; }
  if(s.t==='role'){ const o=s.opts[s.ans]; return {i:cur.opts.indexOf(s.ans),msg:`${o[0]} ${rd(o[1])} · ${s.reply}`}; }
}
function check(){
  const s=Q[qi], a=answerOf(s);
  if(['tone','intro','meaning','mcq','role','lq'].includes(s.t)){ markOpts(a.i); result(cur.sel===a.i,a.msg); if(s.t==='role'&&cur.sel===a.i) say(s.opts[s.ans][0]); }
  else if(s.t==='gap') result(cur.sel===a.i,a.msg);
  else if(s.t==='orderZh') result(cur.picked.map(i=>cur.bank[i]).join('')===s.ans.join(''),a.msg);
  else if(s.t==='orderEn') result(cur.picked.map(i=>cur.bank[i]).join(' ')===s.ans.join(' '),a.msg);
}
function reveal(){
  const s=Q[qi]; if(cur.checked) return;
  if(s.t==='match'){
    stage.querySelectorAll('.mt').forEach(b=>{b.classList.add('done');b.setAttribute('aria-pressed','false');});
    const msg=s.pairs.map(([z,e])=>`${z} ${rd(V[z].py)} = ${e}`).join(' · ');
    result(false,msg,true); return;
  }
  const a=answerOf(s);
  if(['tone','intro','meaning','mcq','role','lq'].includes(s.t)){ if(s.t==='role') say(s.opts[s.ans][0]); cur.sel=null; stage.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed','false')); markOpts(a.i); if(s.t==='intro') say(s.k); }
  else if(s.t==='gap'){ const slot=document.getElementById('slot'); slot.innerHTML=R(s.ans,rdOf(s.ans)); slot.classList.add('filled'); stage.querySelectorAll('.bank .tile').forEach(b=>b.classList.toggle('used',cur.opts[+b.dataset.i]===s.ans)); }
  else if(s.t==='orderZh'||s.t==='orderEn'){
    const used=new Set(); cur.picked=s.ans.map(w=>{ const i=cur.bank.findIndex((x,j)=>x===w&&!used.has(j)); used.add(i); return i; });
    renderAnswer(); say(s.say);
  }
  result(false,a.msg,true);
}
function markOpts(right){
  stage.querySelectorAll('.opt').forEach(b=>{ const i=+b.dataset.i; if(i===right) b.classList.add('right'); else if(i===cur.sel) b.classList.add('wrong'); });
}

/* ---------- Views ---------- */
const listenRow=(text)=>`<div class="listen-row"><button class="listen-big" data-say="${text}" aria-label="Play again">${ICON.spk}</button><button class="slow" data-say-slow="${text}">Slower</button></div>`;
const VIEW={
  learn:s=>LEARN[s.id](s),
  intro:s=>{
    cur.opts=shuffle([s.k,...shuffle((s.pool||lessonWords()).filter(k=>k!==s.k)).slice(0,3)]);
    return `<div class="eyebrow">New word</div><h2>Which picture matches?</h2>
    <div class="prompt-zh">${W(s.k)}${spkBtn(s.k)}</div>
    <div class="opts">${cur.opts.map((k,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${pic(k)}<span>${V[k].en}</span></button>`).join('')}</div>`;
  },
  tone:s=>{
    cur.opts=[1,2,3,4].map(n=>s.py.slice(0,-1)+n);
    return `<div class="eyebrow">Listen</div><h2>Which tone do you hear?</h2>${listenRow(s.ch)}
    <div class="opts">${cur.opts.map((p,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${rd(p)}<span class="sub">tone ${i+1}</span></button>`).join('')}</div>`;
  },
  meaning:s=>{
    cur.opts=shuffle(s.opts);
    return `<div class="eyebrow">Pick the meaning</div><h2>What does this mean?</h2>
    <div class="prompt-zh">${W(s.k)}${spkBtn(s.k)}</div>
    <div class="opts">${cur.opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${o}</button>`).join('')}</div>`;
  },
  gap:s=>{
    cur.opts=shuffle(s.opts);
    return `<div class="eyebrow">Fill the gap</div><h2>Complete the sentence</h2>
    <div class="gap-line">${R(s.pre,s.py)}<span class="gap-slot" id="slot"></span>${R(s.post,s.postPy||'')}</div>
    <p class="gap-en">${s.en}</p>
    <div class="bank">${cur.opts.map((o,i)=>`<button class="tile zh" data-i="${i}">${R(o,rdOf(o))}</button>`).join('')}</div>`;
  },
  orderZh:s=>{
    cur.bank=shuffle([...s.ans,...s.extra]);
    return `<div class="eyebrow">Listen</div><h2>Tap what you hear</h2>${listenRow(s.say)}
    <div class="answer" id="answer" aria-label="Your answer"></div>
    <div class="bank">${cur.bank.map((o,i)=>`<button class="tile zh" data-i="${i}">${R(o,rdOf(o))}</button>`).join('')}</div>`;
  },
  orderEn:s=>{
    cur.bank=shuffle([...s.ans,...s.extra]);
    return `<div class="eyebrow">Listen and translate</div><h2>What does it mean in English?</h2>
    <div class="listen-row"><button class="listen-big" data-say="${s.say}" aria-label="Play again">${ICON.spk}</button><span style="font-size:32px">${R(s.say+'？',s.py)}</span></div>
    <div class="answer" id="answer" aria-label="Your answer"></div>
    <div class="bank">${cur.bank.map((o,i)=>`<button class="tile" data-i="${i}">${o}</button>`).join('')}</div>`;
  },
  match:s=>{
    cur.L=shuffle(s.pairs.map((p,i)=>({i,v:p[0]}))); cur.Rt=shuffle(s.pairs.map((p,i)=>({i,v:p[1]})));
    return `<div class="eyebrow">Match the pairs</div><h2>Tap the matching pairs</h2>
    <div class="match"><div class="col">${cur.L.map(x=>`<button class="mt zh" data-side="L" data-i="${x.i}" data-say="${x.v}">${W(x.v)}</button>`).join('')}</div>
    <div class="col">${cur.Rt.map(x=>`<button class="mt" data-side="R" data-i="${x.i}">${x.v}</button>`).join('')}</div></div>`;
  },
  lq:s=>{
    const others=shuffle(s.pool.filter(x=>x.zh!==s.it.zh)).slice(0,3);
    cur.opts=shuffle([s.it,...others]);
    const hear=s.dir==='hear2zh';
    return `<div class="eyebrow">Learn${s.retry?' · try again':''}</div><h2>${hear?'Which one do you hear?':'What does this mean?'}</h2>
    ${hear?listenRow(s.it.zh):`<div class="prompt-zh">${R(s.it.zh,s.it.py)}${spkBtn(s.it.zh)}</div>`}
    <div class="opts${hear?' zh-opts':''}">${cur.opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false"${hear?` data-optsay="${o.zh}"`:''}>${hear?`<span class="zh">${o.zh.replace(/[，。？！]/g,'')}</span>`:o.en}</button>`).join('')}</div>`;
  },
  mcq:s=>{
    cur.opts=shuffle(s.opts.map((_,i)=>i));
    const lab=o=>Array.isArray(o)?R(o[0],o[1]):o;
    return `<div class="eyebrow">${s.say?'Listen':'Choose'}</div><h2>${s.q}</h2>
    ${s.say?`<div class="prompt-zh">${spkBtn(s.say)}${R(s.say,s.py)}</div>`:''}
    <div class="opts${Array.isArray(s.opts[0])?' zh-opts':' one-col'}">${cur.opts.map((j,i)=>`<button class="opt" data-i="${i}" aria-pressed="false"${Array.isArray(s.opts[j])?` data-optsay="${s.opts[j][0]}"`:''}>${lab(s.opts[j])}</button>`).join('')}</div>`;
  },
  role:s=>{
    cur.opts=shuffle(s.opts.map((_,i)=>i));
    return `<div class="eyebrow">Role-play · 店員 says</div>
    <div class="dlg"><div class="dl l as-line"><span class="who">店</span><span class="bub"><span class="dl-zh">${R(s.line,s.py)}</span><button class="link en-toggle" data-en="${esc(s.en)}">Show English</button></span>${spkBtn(s.line)}</div></div>
    <h2 style="font-size:19px">What do you say?</h2>
    <div class="replies">${cur.opts.map((j,i)=>`<button class="opt reply" data-i="${i}" aria-pressed="false">${R(s.opts[j][0],s.opts[j][1])}</button>`).join('')}</div>`;
  },
  speak:s=>`<div class="eyebrow">Speaking</div><h2>Listen, then say it</h2>
    <div class="speak-card">
      <div class="prompt-zh">${R(s.txt,s.py)}${spkBtn(s.txt)}</div>
      <button class="mic" id="mic" aria-label="Record yourself">${ICON.mic}</button>
      <p class="heard" id="heard">Tap the microphone and say <b>${s.txt}</b>.</p>
    </div>`,
  write:s=>{
    const w=V[s.ch]||{py:s.py,en:s.en}, trace=s.mode==='trace';
    return `<div class="eyebrow">Writing · ${trace?'trace':'from memory'}</div>
    <h2 id="hw-title">${trace?`Watch how ${s.ch} is written`:`Now write ${s.ch} without help`}</h2>
    ${s.first?`<p class="lead">Characters are written stroke by stroke, in a set order: usually top to bottom and left to right. Watch first, then trace.</p>`:''}
    <div class="write-head">${R(s.ch,w.py)}<span class="muted">${w.en}</span>${spkBtn(s.say||s.ch)}</div>
    <div class="write-wrap"><span class="hw-badge${trace?'':' turn'}" id="hw-badge">${trace?'Watch':'Your turn: draw with your finger'}</span><div class="grid-box${trace?'':' turn'}" id="hw"></div></div>
    <div class="write-tools"><button class="slow" id="hw-watch">Watch the strokes</button><button class="slow" id="hw-reset">Start again</button></div>
    <p class="heard" id="hw-msg">${trace?'':'If you miss a stroke twice, it will flash to help you.'}</p>`;
  }
};

/* ---------- Speaking fallback when the microphone isn't allowed ---------- */
let micBroken=false;
const NO_REC='Recording isn’t available here yet.';
function canListen(){
  if(!SR) return false;
  try{ if(document.featurePolicy&&!document.featurePolicy.allowsFeature('microphone')) return false; }catch(e){}
  return !micBroken;
}
/* ---------- Writing (Hanzi Writer) ---------- */
function tok(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#000'; }
function setupWriter(s){
  const box=document.getElementById('hw'), msg=document.getElementById('hw-msg');
  if(!window.HanziWriter){ msg.textContent='The writing tool didn’t load. Check your connection, or tap Skip.'; return; }
  const size=Math.min(box.clientWidth||280,300);
  const trace=s.mode==='trace';
  writer=HanziWriter.create(box,s.ch,{
    width:size,height:size,padding:14,showCharacter:false,showOutline:trace,
    strokeColor:tok('--ink'),outlineColor:tok('--line'),drawingColor:tok('--jade'),highlightColor:tok('--amber'),
    drawingWidth:22,strokeAnimationSpeed:1.1,delayBetweenStrokes:180,
    charDataLoader:(c,done)=>done(STROKES[c])
  });
  const wr=writer;
  const badge=document.getElementById('hw-badge'), title=document.getElementById('hw-title');
  let nudge=null;
  const stopNudge=()=>{ clearInterval(nudge); nudge=null; };
  const yourTurn=()=>{
    badge.textContent='Your turn: draw with your finger'; badge.classList.add('turn'); box.classList.add('turn');
    if(trace){ title.textContent=`Your turn: trace ${s.ch}`; msg.textContent='Start with the flashing stroke.';
      const flash=()=>{ try{ wr.highlightStroke(0); }catch(e){} };
      setTimeout(flash,300); nudge=setInterval(flash,3000); }
  };
  const quiz=()=>wr.quiz({
    showHintAfterMisses:trace?1:2, highlightOnComplete:true,
    onMistake:()=>{ stopNudge(); msg.textContent=trace?'Not quite. Follow the flashing stroke.':'Try that stroke again.'; },
    onCorrectStroke:d=>{ stopNudge(); msg.textContent=`Stroke ${d.strokeNum+1} of ${STROKES[s.ch].strokes.length}`; },
    onComplete:sum=>{
      if(cur.checked) return; stopNudge(); badge.textContent='Done'; badge.classList.remove('turn'); badge.classList.add('done'); box.classList.remove('turn');
      cur.checked=true; RES[qi]=true;   // writing is hard: finishing the character always counts as a success
      setFoot('ok',trace?`${s.ch} has ${STROKES[s.ch].strokes.length} strokes. Next, try it from memory.`:`You wrote ${s.ch}!`);
    }
  });
  const watch=()=>{ stopNudge(); badge.textContent='Watch'; badge.classList.remove('turn'); box.classList.remove('turn'); };
  document.getElementById('hw-watch').onclick=()=>{ if(cur.checked) return; watch(); wr.cancelQuiz(); wr.showOutline(); wr.animateCharacter({onComplete:()=>{ if(!trace) wr.hideOutline(); wr.hideCharacter(); quiz(); yourTurn(); }}); };
  document.getElementById('hw-reset').onclick=()=>{ if(cur.checked) return; wr.cancelQuiz(); quiz(); msg.textContent=''; };
  if(trace){ msg.textContent=''; wr.animateCharacter({onComplete:()=>{ wr.hideCharacter(); quiz(); yourTurn(); }}); }
  else quiz();
  const obs=new MutationObserver(()=>{ if(!document.body.contains(box)){ stopNudge(); obs.disconnect(); } }); obs.observe(stage,{childList:true});
}

/* ---------- Interaction ---------- */
stage.addEventListener('click',e=>{
  const sv=e.target.closest('[data-save]'); if(!sv) return;
  e.stopPropagation(); const k=sv.dataset.save; toggleSave(k);
  if(!tabbar.hidden&&TAB==='saved'){ home('saved'); return; }
  sv.classList.toggle('on',isSaved(k)); sv.textContent=isSaved(k)?'★':'☆';
},true);
stage.addEventListener('click',e=>{
  if(!Q||finished){ const sl=e.target.closest('[data-say-slow]'); if(sl){ say(sl.dataset.saySlow,.55); return; } const sy=e.target.closest('[data-say]'); if(sy) say(sy.dataset.say); return; }
  const slow=e.target.closest('[data-say-slow]'); if(slow){ say(slow.dataset.saySlow,.55); return; }
  const s=Q[qi];
  const opt=e.target.closest('.opt');
  if(opt&&!cur.checked){
    cur.sel=+opt.dataset.i;
    stage.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',b===opt));
    if(s.t==='intro') say(cur.opts[cur.sel]);
    if(opt.dataset.optsay) say(opt.dataset.optsay);
    if(s.t==='role') say(s.opts[cur.opts[cur.sel]][0]);
    enableCheck(true); return;
  }
  const tile=e.target.closest('.tile');
  if(tile&&!cur.checked){
    const i=+tile.dataset.i;
    if(s.t==='gap'){
      cur.sel=i; const slot=document.getElementById('slot');
      slot.innerHTML=R(cur.opts[i],rdOf(cur.opts[i])); slot.classList.add('filled');
      stage.querySelectorAll('.bank .tile').forEach(b=>b.classList.toggle('used',b===tile));
      say(cur.opts[i]); enableCheck(true); return;
    }
    if(tile.closest('#answer')) cur.picked=cur.picked.filter(x=>x!==i);
    else { cur.picked.push(i); if(s.t==='orderZh') say(cur.bank[i]); }
    renderAnswer(); return;
  }
  const mt=e.target.closest('.mt');
  if(mt&&!mt.classList.contains('done')&&!cur.checked){ onMatch(mt); if(mt.dataset.say) say(mt.dataset.say); return; }
  if(e.target.closest('#mic')){ toggleRec(); return; }
  const sayEl=e.target.closest('[data-say]'); if(sayEl) say(sayEl.dataset.say);
});
function renderAnswer(){
  const s=Q[qi], isZh=s.t==='orderZh';
  document.getElementById('answer').innerHTML=cur.picked.map(i=>`<button class="tile${isZh?' zh':''}" data-i="${i}">${isZh?R(cur.bank[i],rdOf(cur.bank[i])):cur.bank[i]}</button>`).join('');
  stage.querySelectorAll('.bank .tile').forEach(b=>b.classList.toggle('used',cur.picked.includes(+b.dataset.i)));
  enableCheck(cur.picked.length>0);
}
function onMatch(el){
  const side=el.dataset.side, prev=stage.querySelector('.mt[aria-pressed="true"]');
  if(!prev||prev.dataset.side===side){ stage.querySelectorAll('.mt').forEach(b=>b.setAttribute('aria-pressed',b===el&&prev!==el)); return; }
  if(prev.dataset.i===el.dataset.i){
    [prev,el].forEach(b=>{b.classList.add('done');b.setAttribute('aria-pressed','false');});
    if(cur.matched+1<Q[qi].pairs.length) sfx('pair');
    if(++cur.matched===Q[qi].pairs.length){
      cur.checked=true;
      RES[qi]=!cur.missed;
      if(cur.missed){ requeue(); setFoot('ok','All matched. The ones you mixed up will come back.'); }
      else setFoot('ok','All pairs matched.');
      progress();
    }
  } else {
    cur.missed=true;
    [prev,el].forEach(b=>{b.classList.add('shake');b.setAttribute('aria-pressed','false');setTimeout(()=>b.classList.remove('shake'),450);});
  }
}

/* ---------- Sound effects: short, quiet tones made in the browser ---------- */
let AC=null, SFX=store.get('tw.sfx',true);
function sfx(kind){
  if(!SFX) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime;
    const tone=(f,at,dur,type,vol)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+at); g.gain.exponentialRampToValueAtTime(vol,t+at+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+at+dur);
      o.connect(g); g.connect(AC.destination); o.start(t+at); o.stop(t+at+dur+.05); };
    if(kind==='ok'){ tone(784,0,.22,'sine',.09); tone(1175,.09,.32,'sine',.07); }      // bright two-note chime
    else if(kind==='no'){ tone(294,0,.28,'sine',.06); tone(247,.12,.34,'sine',.05); } // soft, low, short
    else if(kind==='pair'){ tone(988,0,.14,'sine',.05); }
  }catch(e){}
}

/* ---------- Audio (device zh-TW voice) ---------- */
const synth=window.speechSynthesis||null; let voice=null;
function pickVoice(){
  if(!synth) return; const vs=synth.getVoices();
  const tw=vs.filter(v=>/zh[-_]TW/i.test(v.lang));
  const pref=['Mei-Jia','美佳','HsiaoChen','曉臻','Hanhan','Yating','Google 國語'];
  voice=tw.find(v=>pref.some(p=>v.name.includes(p)))||tw[0]||vs.find(v=>/^(zh|cmn)/i.test(v.lang))||null;
}
if(synth){ pickVoice(); synth.addEventListener?synth.addEventListener('voiceschanged',pickVoice):(synth.onvoiceschanged=pickVoice); }
let warned=false;
function say(text,rate){
  if(!synth){ if(!warned){toast('Audio isn’t available in this browser.');warned=true;} return; }
  synth.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW'; u.rate=rate||TW.getRate(); if(voice) u.voice=voice; synth.speak(u);
}
function stopSpeaking(){ if(synth) synth.cancel(); }

/* ---------- Speaking: browser speech recognition (Azure scoring comes later) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null;
function stopRec(){ if(rec){ try{rec.abort()}catch(e){} rec=null; } }
function speakFallback(msg){
  const h=document.getElementById('heard'); if(h) h.innerHTML=msg;
  cur.checked=true; setFoot('ok','Say it out loud a few times, copying the audio.',true);
  document.querySelector('.foot .fb b').textContent='Practise out loud';
}
function toggleRec(){
  const s=Q[qi], mic=document.getElementById('mic'), heard=document.getElementById('heard');
  if(cur.checked) return;
  if(rec){ stopRec(); mic.classList.remove('on'); return; }
  if(!canListen()){ speakFallback(NO_REC); return; }
  rec=new SR(); rec.lang='zh-TW'; rec.interimResults=false; rec.maxAlternatives=5;
  mic.classList.add('on'); heard.textContent='Listening…';
  let started=false; rec.onstart=()=>{ started=true; };
  const watchdog=setTimeout(()=>{ if(!started&&rec){ stopRec(); mic.classList.remove('on'); speakFallback(NO_REC); } },3000);
  rec.onresult=ev=>{
    const alts=[...ev.results[0]].map(a=>a.transcript.replace(/[\s，。？！,.?!]/g,''));
    const ok=alts.some(a=>a.includes(s.txt));
    heard.innerHTML=`I heard: <b>${esc(alts[0]||'…')}</b>`;
    rec=null; mic.classList.remove('on');
    if(ok){ RES[qi]=true; cur.checked=true; setFoot('ok','Clear and recognisable.'); }
    else heard.innerHTML+=`<br><span class="muted">Not quite ${s.txt}. Listen again and have another go.</span>`;
  };
  rec.onerror=ev=>{
    mic.classList.remove('on'); rec=null;
    if(['not-allowed','service-not-allowed','audio-capture'].includes(ev.error)){ clearTimeout(watchdog); speakFallback(NO_REC); }
    else if(ev.error==='no-speech') heard.textContent='I didn’t hear anything. Tap and try again.';
    else speakFallback('Speech recognition isn’t working here right now.');
  };
  rec.onend=()=>{ mic.classList.remove('on'); rec=null; };
  try{ rec.start(); }catch(e){ clearTimeout(watchdog); speakFallback(NO_REC); }
}

/* ---------- Finish ---------- */
function finish(){
  finished=true; progress(); stopSpeaking(); const bk=document.getElementById('back'); if(bk) bk.hidden=true;
  const vals=Object.values(RES), right=vals.filter(Boolean).length;
  const acc=Math.round(100*right/Math.max(1,vals.length));
  if(LID!=='practice'){ DONE[LID]={acc,at:Date.now()}; store.set('tw.lessons',DONE); delete PARTIAL[LID]; store.set('tw.partial',PARTIAL); }
  const l1=LID===1, pr=LID==='practice', sc=isScene(LID);
  stage.innerHTML=`<div class="finish">
    <div class="hero">${HELLO_ART}</div>
    <div class="eyebrow">${sc?`Daily Life · ${SCENES[LID].zh} · complete`:pr?`Learn · ${esc(LRN.title)} · complete`:`Lesson ${LID} complete · 第${'零一二三四五六七八九十'[LID]}課完成`}</div>
    <h1>${pr?`${LRN.items.length} word${LRN.items.length>1?'s':''} reviewed`:getL(LID).done}</h1>
    <div class="stats">
      <div class="stat"><b>${acc}%</b><span>accuracy</span></div>
      <div class="stat"><b>${sc?PHRASES[LID].length:pr?LRN.items.length:l1?5:lessonWords().length}</b><span>${sc?'key phrases':pr?'words mastered':l1?'tones':'new words'}</span></div>
    </div>
    ${l1||pr||sc?'':`<div class="learned">${lessonWords().map(k=>`<button class="chip" data-say="${k}">${W(k)}</button>`).join('')}</div>`}
    <p class="muted">${sc?'Next time you’re at the counter, try it for real.':pr?'They’ll come back for review right before you’d forget them.':LESSONS[LID].next}</p>
  </div>`;
  foot.className='foot';
  const nx=!pr&&!sc&&LESSONS[LID+1]&&!DONE[LID+1]?LID+1:null;
  footIn.innerHTML=nx?`<button class="go" id="go">START LESSON ${nx}</button>`:`<button class="go" id="go">${sc?'BACK TO DAILY LIFE':pr?'BACK TO PRACTICE':'BACK TO MY PATH'}</button>`;
  document.getElementById('go').onclick=()=>LID==='practice'?home('practice'):sc?home('life'):nx?startLesson(nx):home('learn');
}

/* ---------- Reading-aid switch ---------- */
function segHTML(){ return MODES.map(([id,zh,en])=>`<button data-mode="${id}" aria-pressed="${MODE===id}">${zh}<small>${en}</small></button>`).join(''); }
function bindSegs(){ document.querySelectorAll('[data-seg]').forEach(el=>el.innerHTML=segHTML());
  document.querySelectorAll('[data-theme-seg]').forEach(el=>el.innerHTML=TW.THEMES.map(([id,en])=>`<button data-th="${id}" aria-pressed="${TW.getTheme()===id}">${en}</button>`).join(''));
  document.querySelectorAll('[data-rate-seg]').forEach(el=>el.innerHTML=TW.RATES.map(([v,en])=>`<button data-rate="${v}" aria-pressed="${TW.getRate()===v}">${en}<small>${v}×</small></button>`).join('')); }
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-mode]'); if(m){ MODE=m.dataset.mode; store.set('tw.mode2',MODE); applyMode(); bindSegs(); return; }
  const th=e.target.closest('[data-th]'); if(th){ TW.setTheme(th.dataset.th); bindSegs(); return; }
  const rt=e.target.closest('[data-rate]'); if(rt){ TW.setRate(+rt.dataset.rate); bindSegs(); say('你好，歡迎來台灣。'); return; }
  if(e.target.closest('#mode-btn,[data-open-modes],#settings-btn')){ openSettings(); return; }
  const tb=e.target.closest('[data-tab]'); if(tb){ home(tb.dataset.tab); return; }
  const sl=e.target.closest('[data-slv]'); if(sl){ STORY_LV=sl.dataset.slv==='all'?'all':+sl.dataset.slv; home('stories'); return; }
  const rv=e.target.closest('[data-review]'); if(rv){ startLearn(shuffle(dueItems()).slice(0,10),'Today’s review'); return; }
  const fc=e.target.closest('[data-fc]'); if(fc){ startFlash(fc.dataset.fc); return; }
  const ln=e.target.closest('[data-learn]'); if(ln){ const st=setById(ln.dataset.learn); if(st) startLearn(st.items,st.title); return; }
  const mt=e.target.closest('[data-match]'); if(mt&&!mt.disabled){ startMatch(mt.dataset.match); return; }
  const ls=e.target.closest('#stage [data-lesson]'); if(ls&&!Q){ const v=ls.dataset.lesson; startLesson(isNaN(v)?v:+v); return; }
  if(e.target.closest('#exit')){ home(); return; }
  if(e.target.closest('#play-all')){ playAll(); return; }
  const et=e.target.closest('.en-toggle'); if(et){ et.outerHTML=`<small>${et.dataset.en}</small>`; return; }
  if(e.target.closest('#back')){ goBack(); }
});
const sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim');
function openSettings(){
  const onHome=!tabbar.hidden;
  const bgName=(BGS.find(b=>b[0]===BG)||BGS[0])[1];
  document.getElementById('sheet-body').innerHTML=`
    <h2 style="font-size:19px">Settings</h2>
    <div class="set-sec"><b>Show with the characters</b><div class="seg" data-seg></div>
      <p class="muted small">Pinyin uses Latin letters. Zhuyin (ㄅㄆㄇ) is Taiwan’s own phonetic alphabet and sits to the right of each character.</p></div>
    <div class="set-sec"><b>Theme</b><div class="seg seg3" data-theme-seg></div></div>
    <div class="set-sec"><b>Voice speed</b><div class="seg seg3" data-rate-seg></div></div>
    <div class="set-row"><b>Sound effects</b><button class="switch" id="sfx-sw" role="switch" aria-checked="${SFX}" aria-label="Sound effects"><i></i></button></div>
    ${onHome?`
    <div class="set-row"><span><b>Your level</b><br><span class="muted small">${LEVEL==null?'Not set':lvlName(LEVEL)}</span></span><span class="set-acts"><button class="link" id="pick-level">Change</button><button class="link" id="retest">Retake test</button></span></div>
    <div class="set-row"><span><b>Your background</b><br><span class="muted small">${bgName}</span></span><button class="link" id="change-bg">Change</button></div>
    <div class="set-row"><span><b>Start over</b><br><span class="muted small">Erases your level, progress and saved words on this device.</span></span><button class="link danger" id="reset">Start over</button></div>`:''}`;
  bindSegs(); sheet.hidden=false; scrim.hidden=false;
  const sw=document.getElementById('sfx-sw'); sw.onclick=()=>{ SFX=!SFX; store.set('tw.sfx',SFX); sw.setAttribute('aria-checked',SFX); if(SFX) sfx('ok'); };
  const on=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=()=>{ closeSheet(); fn(); }; };
  on('pick-level',levelPicker); on('retest',placementIntro); on('change-bg',onboarding);
  const rs=document.getElementById('reset'); if(rs) rs.onclick=()=>{
    if(!rs.dataset.armed){ rs.dataset.armed='1'; rs.textContent='Tap again to erase'; return; }
    ['tw.bg','tw.level','tw.lessons','tw.mode2','tw.saved','tw.sfx','tw.partial','tw.mem','tw.best','tw.fcfront','tw.theme','tw.rate'].forEach(k=>{try{localStorage.removeItem(k)}catch(err){}});
    BG=null; LEVEL=null; DONE={}; MODE='py'; SAVED=[]; SFX=true; PARTIAL={}; MEM={}; TAB='learn'; TW.applyTheme(); closeSheet(); onboarding();
  };
}
const closeSheet=()=>{ sheet.hidden=true; scrim.hidden=true; };
document.getElementById('sheet-done').onclick=closeSheet; scrim.onclick=closeSheet;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2200); }

/* ---------- Shared app: settings and Saved Words kept in sync with the Story Reader ---------- */
TW.onSync(()=>{
  MODE=store.get('tw.mode2','py'); SAVED=store.get('tw.saved',[]); MEM=store.get('tw.mem',{});
  DONE=store.get('tw.lessons',{}); LEVEL=store.get('tw.level',null);
  applyMode(); bindSegs(); if(!tabbar.hidden) home();
});
const TAB0=location.hash.slice(1); if(TABS_META.some(t=>t[0]===TAB0)){ TAB=TAB0; history.replaceState(null,'',location.pathname); }
BG?home():onboarding();
</script>
