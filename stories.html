<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stories · 台灣華語</title>
<meta name="description" content="Graded Taiwan Mandarin stories with tap-to-translate and read-aloud.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="台灣華語">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="shared/app.js"></script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* Curly quotes and apostrophes come from a Latin font, so they don't get full-width CJK spacing */
@font-face{font-family:"LatinPunct";src:local("Helvetica Neue"),local("HelveticaNeue"),local("Helvetica"),local("Arial"),local("Segoe UI"),local("Roboto"),local("Noto Sans"),local("DejaVu Sans");unicode-range:U+2018-201F,U+2026}
@font-face{font-family:"LatinPunctSerif";src:local("Georgia"),local("Times New Roman"),local("Times"),local("Noto Serif"),local("DejaVu Serif");unicode-range:U+2018-201F,U+2026}
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#18201C; --muted:#5B6660; --line:#D6DDD8;
  --jade:#0D7A63; --jade-ink:#FFFFFF; --jade-soft:#DDF0E9;
  --amber:#B8600B; --amber-soft:#FBEAD6; --sel:#FFEFAE; --scrim:rgba(12,18,15,.42);
  --sans:"LatinPunct","Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"LatinPunctSerif","Noto Serif TC","Songti TC","PMingLiU",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101412; --surface:#19201C; --ink:#E5EBE7; --muted:#99A69F; --line:#2B3530;
    --jade:#4CC6A5; --jade-ink:#08140F; --jade-soft:#16362C;
    --amber:#F0A452; --amber-soft:#3A2812; --sel:#4A4318; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101412; --surface:#19201C; --ink:#E5EBE7; --muted:#99A69F; --line:#2B3530;
  --jade:#4CC6A5; --jade-ink:#08140F; --jade-soft:#16362C;
  --amber:#F0A452; --amber-soft:#3A2812; --sel:#4A4318; --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:6px}
.app{max-width:680px;margin-inline:auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.04em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--jade);color:var(--jade-ink)}
.count{font-variant-numeric:tabular-nums}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 4px}
.back{border:0;background:none;padding:4px 0;color:var(--jade);font-weight:500;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;font-size:12.5px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.seg button+button{border-left:1px solid var(--line)}
.seg button small{font-size:10.5px;font-weight:400;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--jade-soft);color:var(--ink)}
.seg-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.seg-wrap{display:flex;align-items:center}

/* story head */
.head{display:grid;gap:6px;padding-block:18px 8px}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--jade);letter-spacing:.03em}
.lvl i{font-style:normal;background:var(--jade);color:var(--jade-ink);border-radius:5px;padding:1px 7px;font-weight:700}
h1{font-family:var(--serif);font-size:clamp(26px,7vw,34px);line-height:1.25;margin:0;font-weight:700;letter-spacing:.03em;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding-block:10px 0}
.legend .up-sample{color:var(--amber);text-decoration:underline 2px var(--amber);text-underline-offset:4px;font-family:var(--serif)}
.hint{margin-top:14px;font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}

/* story text */
.story{font-family:var(--serif);font-size:clamp(22px,5.8vw,28px);font-weight:500;padding-block:12px 24px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.story p{margin:0 0 .9em;line-height:2.15;text-indent:0}
.story.m-hz p{line-height:1.9}
.sent{border-radius:6px;transition:background-color .15s}
.sent.pressing{background:var(--jade-soft)}
.sent.on{background:var(--jade-soft)}
.g{white-space:nowrap}
.w{cursor:pointer;border-radius:5px}
.w.up .hz{color:var(--amber);text-decoration:underline 2px var(--amber);text-underline-offset:.22em}
.w.up{margin-inline:.1em}
@media (hover:hover){
  .w:hover{background:var(--jade-soft)}
  .w:hover .hz,.w.up:hover .hz{color:var(--jade);text-decoration-color:var(--jade)}
}
.w.on{background:var(--sel)}
.c{display:inline-grid;grid-template-columns:auto auto;grid-template-areas:"py ." "hz zy";align-items:end;justify-items:center;vertical-align:baseline}
.py{grid-area:py;font-family:var(--sans);font-size:.44em;font-weight:400;line-height:1.1;color:var(--muted);padding-inline:1px;white-space:nowrap}
.hz{grid-area:hz;line-height:1.25}
.zy{grid-area:zy;writing-mode:vertical-rl;font-family:var(--sans);font-size:.42em;line-height:1;color:var(--muted);align-self:center;margin-left:1px}
.zy:empty{display:none}
.m-py .zy,.m-zy .py,.m-hz .zy,.m-hz .py{display:none}

/* library */
.lib-head{padding-block:22px 6px;display:grid;gap:4px}
.lib-head h2{font-family:var(--serif);font-size:24px;margin:0}
.lib-head p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-block:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft)}
.cards{display:grid;gap:12px}
.card{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%}
.card:hover{border-color:var(--jade)}
.card .info{display:grid;gap:4px;min-width:0}
.thumb{display:block;border-radius:10px;overflow:hidden;aspect-ratio:440/240}
.thumb svg{display:block;width:100%;height:100%}
.art{border-radius:16px;overflow:hidden;aspect-ratio:440/240;max-width:100%;margin-bottom:10px}
.art svg{display:block;width:100%;height:100%}
@media (max-width:460px){.card{grid-template-columns:1fr}.thumb{width:100%}}
.card .t{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.03em}
.card .e{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .amb{color:var(--amber)}
.empty-lvl{color:var(--muted);font-size:14px;padding:12px 2px}

/* saved */
.saved-list{display:grid;gap:10px;padding-block:6px}
.sw{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sw .word{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:.04em}
.sw .rd{font-size:13px;color:var(--muted)}
.sw .mn{grid-column:1/-1}
.sw .from{grid-column:1/-1;font-size:12px;color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btns{display:flex;gap:6px}
.note-box{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;color:var(--muted);text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin-inline:auto;max-width:680px;background:var(--surface);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:up .2s ease-out;max-height:80vh;overflow:auto}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.sent{transition:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet .close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:6px}
.big{font-family:var(--serif);font-size:48px;font-weight:700;line-height:1.2}
.big .py{font-size:.36em}
.big .zy{font-size:.3em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-block:10px}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.amb{background:var(--amber-soft);border-color:transparent;color:var(--amber);font-weight:500}
.tag.tw{background:var(--jade-soft);border-color:transparent;color:var(--jade);font-weight:500}
.meaning{font-size:19px;margin:4px 0 8px;line-height:1.4}
.wnote{font-size:13.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.btn svg{width:18px;height:18px}
.sent-zh{font-family:var(--serif);font-size:22px;line-height:1.6;margin:6px 0 8px;letter-spacing:.02em}
.sent-en{font-size:17px;margin:0 0 14px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.06)}
.player-in{max-width:680px;margin-inline:auto;display:flex;align-items:center;gap:12px}
.pl-btns{display:flex;align-items:center;gap:4px}
.pl-b{border:0;background:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.pl-b svg{width:18px;height:18px}
.pl-main{width:48px;height:48px;background:var(--jade);color:var(--jade-ink)}
.pl-main svg{width:22px;height:22px}
.pl-info{flex:1;min-width:0;display:grid;gap:4px}
.pl-pos{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.pl-bar i{display:block;height:100%;width:0;background:var(--jade);transition:width .3s}
.pl-voice{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-voice.warn{color:var(--amber);white-space:normal}
.pl-rate{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
body.has-player{padding-bottom:110px}
.sent.reading{background:var(--jade-soft);box-shadow:0 0 0 3px var(--jade-soft)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13.5px;z-index:30;max-width:calc(100% - 32px)}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:10px}
@media (max-width:420px){
  .brand span{display:none}
  .seg-label{display:none}
  .seg button{padding:6px 8px}
}

/* merged app: back-to-app button, Saved link */
.home-b{display:grid;place-items:center;width:34px;height:34px;margin-left:-6px;border-radius:10px;color:var(--ink);flex:none}
.home-b svg{width:22px;height:22px}
.home-b:hover{background:var(--surface)}
.top .brand{flex:1}
.tabs a{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;text-decoration:none}
.tabs a:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="home-b" href="./#stories" aria-label="Back to the app" title="Back to the app"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7M6 9.5V20h4.5v-5.5h3V20H18V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <div class="brand"><b>台灣華語</b><span>Graded stories</span></div>
    <nav class="tabs" aria-label="Sections">
      <button id="tab-stories" aria-pressed="true">Stories</button>
      <a id="tab-saved" href="./#saved">Saved <span class="count" id="saved-count">0</span></a>
    </nav>
  </header>
  <main id="view"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Details">
  <div class="grab"></div>
  <button class="close" id="sheet-close" aria-label="Close">×</button>
  <div id="sheet-body"></div>
</section>
<div class="player" id="player" hidden>
  <div class="player-in">
    <div class="pl-btns">
      <button class="pl-b" id="pl-prev" aria-label="Previous sentence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14M19 5 9 12l10 7z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
      <button class="pl-b pl-main" id="pl-play" aria-label="Play story"></button>
      <button class="pl-b" id="pl-next" aria-label="Next sentence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14M5 5l10 7-10 7z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="pl-info">
      <div class="pl-pos" id="pl-pos">Listen to the story</div>
      <div class="pl-bar"><i id="pl-fill"></i></div>
      <div class="pl-voice" id="pl-voice"></div>
    </div>
    <button class="pl-rate" id="pl-rate" aria-label="Reading speed">0.85×</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Pinyin → tone marks and Zhuyin ---------- */
const MARKS={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function toneMark(syl){
  const t=+syl.slice(-1); let b=syl.slice(0,-1).replace('v','ü');
  if(!(t>=1&&t<=4)) return b;
  let idx=b.indexOf('a'); if(idx<0) idx=b.indexOf('e'); if(idx<0&&b.includes('ou')) idx=b.indexOf('o');
  if(idx<0){ for(let i=b.length-1;i>=0;i--){ if('iouü'.includes(b[i])){idx=i;break;} } }
  if(idx<0) return b;
  return b.slice(0,idx)+MARKS[b[idx]][t-1]+b.slice(idx+1);
}
const INI={b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'};
const FIN={a:'ㄚ',o:'ㄛ',e:'ㄜ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',ong:'ㄨㄥ',
 i:'ㄧ',ia:'ㄧㄚ',ie:'ㄧㄝ',iao:'ㄧㄠ',iu:'ㄧㄡ',iou:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',iong:'ㄩㄥ',
 u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',ui:'ㄨㄟ',uei:'ㄨㄟ',uan:'ㄨㄢ',un:'ㄨㄣ',uen:'ㄨㄣ',uang:'ㄨㄤ',ueng:'ㄨㄥ',
 v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ'};
const TONE=['','','ˊ','ˇ','ˋ'];
function zhuyin(syl){
  const t=+syl.slice(-1); let b=syl.slice(0,-1).replace('ü','v');
  let out='';
  if(/^(zh|ch|sh|r|z|c|s)i$/.test(b)) out=INI[b.slice(0,-1)];
  else{
    if(b[0]==='y'){ if(b.startsWith('yi')) b=b.slice(1); else if(b.startsWith('yu')) b='v'+b.slice(2); else b='i'+b.slice(1); }
    else if(b[0]==='w'){ b = b==='wu' ? 'u' : 'u'+b.slice(1); }
    let ini=''; const two=b.slice(0,2);
    if(INI[two]&&two.length===2&&['zh','ch','sh'].includes(two)){ini=two;b=b.slice(2);}
    else if(INI[b[0]]&&!'aeiouv'.includes(b[0])){ini=b[0];b=b.slice(1);}
    if('jqx'.includes(ini)&&ini&&b[0]==='u') b='v'+b.slice(1);
    out=(ini?INI[ini]:'')+(FIN[b]??'');
  }
  return t===5||t===0 ? '˙'+out : out+TONE[t];
}

/* ---------- Dictionary: key → [pinyin, English, part of speech, TOCFL level (0 = name), note, Taiwan usage] ---------- */
const D={
'包子':['bao1 zi5','steamed bun','noun',0],
'風':['feng1','wind; breeze','noun',0],
'舒服':['shu1 fu5','comfortable; pleasant','adjective',1],
'得':['de5','links a verb to how well it is done (玩得很高興)','particle',0],
'高興':['gao1 xing4','happy; glad','adjective',1],
'客氣':['ke4 qi5','polite','adjective',1],
'咖啡':['ka1 fei1','coffee','noun',0],
'三明治':['san1 ming2 zhi4','sandwich','noun',1],
'火車':['huo3 che1','train','noun',0],
'票':['piao4','ticket','noun',1],
'桌子':['zhuo1 zi5','table','noun',0],
'椅子':['yi3 zi5','chair','noun',0],
'遊戲':['you2 xi4','game','noun',2],
'輸':['shu1','to lose (a game)','verb',3],
'禮物':['li3 wu4','present; gift','noun',1],
'今天':['jin1 tian1','today','time word',0],

            : wear==='apron' ? '<path d="M-28 -22 Q0 -48 28 -22 Q0 -30 -28 -22Z" fill="#E77A8A"/><circle cx="-10" cy="-32" r="1.6" fill="#FFF"/><circle cx="4" cy="-35" r="1.6" fill="#FFF"/><circle cx="16" cy="-30" r="1.6" fill="#FFF"/><path d="M26 -24 l10 -4 l-2 8z" fill="#E77A8A"/>'
            : '';

};

const OPENERS='「『（';
const disp=k=>k.split('#')[0];
const isWord=k=>!!D[k];

/* ---------- State ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={view:'library',story:'mrt',mode:store.get('tw.mode2','py'),filter:0};
const MODES=[['py','Pinyin','拼音'],['zy','Zhuyin','注音'],['all','Both','拼+注'],['hz','Hanzi','漢字']];

/* ---------- Rendering helpers ---------- */
function unit(ch,syl){
  const py=syl?toneMark(syl):'&nbsp;', zy=syl?zhuyin(syl):'';
  return `<span class="c"><span class="py">${py}</span><span class="hz">${ch}</span><span class="zy">${zy}</span></span>`;
}
function wordUnits(k){
  const chars=[...disp(k)], syls=D[k][0].split(' ');
  if(chars.length!==syls.length) console.warn('Pinyin count mismatch',k);
  return chars.map((c,i)=>unit(c,syls[i])).join('');
}
function pinyinText(k){return D[k][0].split(' ').map(toneMark).join('')}
function zhuyinText(k){return D[k][0].split(' ').map(zhuyin).join(' ')}
function readingLine(k){
  const m=S.mode, p=pinyinText(k), z=zhuyinText(k);
  if(m==='py') return p; if(m==='zy') return z; return p+' · '+z;
}
function renderSentence(src,idx,lvl){
  const toks=src.split('|'); const groups=[]; let pend='';
  toks.forEach(k=>{
    if(isWord(k)){
      const up=D[k][3]>lvl;
      groups.push(pend+`<span class="w${up?' up':''}" data-k="${k}" role="button" tabindex="0">${wordUnits(k)}</span>`); pend='';
    } else if(OPENERS.includes(k)){ pend+=unit(k,null); }
    else { if(groups.length) groups[groups.length-1]+=unit(k,null); else pend+=unit(k,null); }
  });
  return `<span class="sent" data-s="${idx}">`+groups.map(g=>`<span class="g">${g}</span>`).join('​')+`</span>`;
}
function flatSentences(st){return st.paras.flat()}
function storyStats(st){
  const words=new Set(), up=new Set(); let n=0;
  flatSentences(st).forEach(([s])=>s.split('|').forEach(k=>{ if(isWord(k)){n++;words.add(k); if(D[k][3]>st.lvl) up.add(disp(k));} }));
  return {n,unique:words.size,up:up.size};
}
const lvlLabel=l=>`Level ${l} · ${LEVELS[l][0]} · ${LEVELS[l][1]}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Views ---------- */
const view=document.getElementById('view');
function render(){
  document.getElementById('tab-stories').setAttribute('aria-pressed',S.view!=='saved');
  document.getElementById('tab-saved').setAttribute('aria-pressed',S.view==='saved');
  document.getElementById('saved-count').textContent=TW.saved.count();
  if(S.view!=='reader') stopPlayer(true);
  if(S.view==='reader') renderReader(); else renderLibrary();
  playerBar.hidden=S.view!=='reader'; document.body.classList.toggle('has-player',S.view==='reader');
  if(S.view==='reader') syncPlayer();
}
function modeControl(){
  return `<div class="seg-wrap"><span class="seg-label">Show</span><div class="seg" role="group" aria-label="Reading aids">`+
    MODES.map(([id,en,zh])=>`<button data-mode="${id}" aria-pressed="${S.mode===id}">${zh}<small>${en}</small></button>`).join('')+`</div></div>`;
}
function renderReader(){
  const st=STORIES.find(s=>s.id===S.story), stats=storyStats(st);
  let i=0;
  const body=st.paras.map(p=>'<p>'+p.map(([s])=>renderSentence(s,i++,st.lvl)).join('')+'</p>').join('');
  view.innerHTML=`
    <div class="toolbar"><button class="back" data-go="library">← All stories</button>${modeControl()}</div>
    <div class="head">
      <div class="art">${ART[st.id]||''}</div>
      <span class="lvl"><i>${st.lvl}</i>${lvlLabel(st.lvl)}</span>
      <h1>${st.zh}</h1>
      <p class="sub">${st.en}</p>
      <div class="legend"><span><span class="up-sample">底線</span> = above Level ${st.lvl} (${stats.up} words)</span><span>${stats.n} words · ${stats.unique} unique</span></div>
      <div class="hint">Tap any word for its meaning. Press and hold a sentence to see the translation. Press ▶ at the bottom to listen to the whole story.</div>
    </div>
    <article class="story m-${S.mode}" id="story">${body}</article>`;
}
function renderLibrary(){
  const lv=[1,2,3,4,5];
  const list=STORIES.filter(s=>!S.filter||s.lvl===S.filter);
  view.innerHTML=`
    <div class="lib-head"><h2>Graded stories</h2><p>Sorted by TOCFL level. Traditional characters, Taiwan vocabulary.</p></div>
    <div class="chips" role="group" aria-label="Filter by level">
      <button class="chip" data-filter="0" aria-pressed="${!S.filter}">All levels</button>
      ${lv.map(l=>`<button class="chip" data-filter="${l}" aria-pressed="${S.filter===l}">Level ${l} ${LEVELS[l][0]}</button>`).join('')}
    </div>
    <div class="cards">${list.length?list.map(s=>{const t=storyStats(s);return `
      <button class="card" data-open="${s.id}">
        <span class="thumb" aria-hidden="true">${ART[s.id]||''}</span>
        <span class="info">
          <span class="lvl"><i>${s.lvl}</i>${lvlLabel(s.lvl)}</span>
          <span class="t">${s.zh}</span><span class="e">${s.en}</span>
          <span class="meta"><span>${t.n} words</span><span>${flatSentences(s).length} sentences</span><span class="amb">${t.up} above level</span></span>
        </span>
      </button>`}).join(''):`<p class="empty-lvl">No stories at Level ${S.filter} yet.</p>`}</div>`;
}

/* ---------- Sheet ---------- */
const ICON={
 play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
 save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
 saved:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>'
};
const sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim'), sheetBody=document.getElementById('sheet-body');
let lastFocus=null;
function openSheet(html){ lastFocus=document.activeElement; sheetBody.innerHTML=html; sheet.hidden=false; scrim.hidden=false; document.getElementById('sheet-close').focus({preventScroll:true}); }
function closeSheet(){ sheet.hidden=true; scrim.hidden=true; document.querySelectorAll('.w.on,.sent.on').forEach(e=>e.classList.remove('on')); if(lastFocus&&lastFocus.focus) lastFocus.focus({preventScroll:true}); }
const isSaved=k=>TW.saved.has(k);
function wordSheet(k){
  const [py,en,pos,lvl,note,tw]=D[k]; const st=STORIES.find(s=>s.id===S.story);
  const up=st&&lvl>st.lvl; const m=S.mode==='hz'?'all':S.mode;
  return `
    <div class="eyebrow">Word</div>
    <div class="big m-${m}">${wordUnits(k)}</div>
    <div class="tags">
      <span class="tag">${pos}</span>
      <span class="tag${up?' amb':''}">${lvlTag(lvl,pos)}${up?' · above this story':''}</span>
      ${tw?`<span class="tag tw">Taiwan usage</span>`:''}
    </div>
    <p class="meaning">${esc(en)}</p>
    ${note?`<p class="wnote">${esc(note)}</p>`:''}
    <div class="actions">
      <button class="btn" data-say="${k}">${ICON.play} Listen</button>
      <button class="btn${isSaved(k)?'':' primary'}" data-save="${k}">${isSaved(k)?ICON.saved+' Saved':ICON.save+' Save word'}</button>
    </div>`;
}
function sentenceSheet(i){
  const st=STORIES.find(s=>s.id===S.story); const [src,en]=flatSentences(st)[i];
  const zh=src.split('|').map(disp).join('');
  return `
    <div class="eyebrow">Sentence ${i+1}</div>
    <p class="sent-zh">${zh}</p>
    <p class="sent-en">${esc(en)}</p>
    <div class="actions"><button class="btn primary" data-say-text="${zh}">${ICON.play} Listen</button></div>`;
}

/* ---------- Audio ---------- */
const synth=window.speechSynthesis||null;
let voice=null, voiceNote='';
function pickVoice(){
  if(!synth){ voiceNote='Audio isn’t available in this browser.'; return; }
  const vs=synth.getVoices();
  const tw=vs.filter(v=>/zh[-_]TW/i.test(v.lang));
  const pref=['Mei-Jia','美佳','HsiaoChen','曉臻','Hanhan','Yating','Google 國語'];
  voice=tw.find(v=>pref.some(p=>v.name.includes(p)))||tw[0]||null;
  if(voice){ voiceNote='Voice: '+voice.name+' · Taiwan Mandarin'; }
  else{
    const zh=vs.find(v=>/^(zh|cmn)/i.test(v.lang));
    voice=zh||null;
    voiceNote= zh ? 'No Taiwan voice on this device, using '+zh.name+'. On iPhone add one in Settings › Accessibility › Spoken Content › Voices › Chinese (Taiwan).'
               : vs.length ? 'No Chinese voice found on this device.' : '';
  }
  const el=document.getElementById('pl-voice');
  if(el){ el.textContent=voiceNote; el.classList.toggle('warn',!!voiceNote&&!/Taiwan Mandarin$/.test(voiceNote)); }
}
if(synth){ pickVoice(); synth.addEventListener?synth.addEventListener('voiceschanged',pickVoice):(synth.onvoiceschanged=pickVoice); }
function utter(text,rate){
  const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW'; u.rate=rate; if(voice) u.voice=voice; return u;
}
function speak(text){
  if(!synth){ toast('Audio isn’t available in this browser.'); return; }
  stopPlayer(false);
  synth.cancel(); synth.speak(utter(text,.8));
}

/* ---------- Story player ---------- */
const playerBar=document.getElementById('player');
const ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>';
const RATES=[0.7,0.85,1];
const PL={playing:false,idx:0,rate:store.get('tw.rate',0.85),run:0};
function sentencesOf(){ const st=STORIES.find(s=>s.id===S.story); return st?flatSentences(st):[]; }
function sentenceText(i){ return sentencesOf()[i][0].split('|').map(disp).join(''); }
function syncPlayer(){
  const n=sentencesOf().length;
  document.getElementById('pl-play').innerHTML=PL.playing?ICON_PAUSE:ICON_PLAY;
  document.getElementById('pl-play').setAttribute('aria-label',PL.playing?'Pause':'Play story');
  document.getElementById('pl-rate').textContent=PL.rate+'×';
  const started=PL.playing||PL.idx>0;
  document.getElementById('pl-pos').textContent=started?`Sentence ${PL.idx+1} of ${n}`:`Listen to the story · ${n} sentences`;
  document.getElementById('pl-fill').style.width=(started?((PL.idx+(PL.playing?1:0))/n*100):0)+'%';
  document.getElementById('pl-voice').textContent=voiceNote;
  document.querySelectorAll('.sent.reading').forEach(e=>e.classList.remove('reading'));
  if(started){ const el=document.querySelector(`#story .sent[data-s="${PL.idx}"]`); if(el) el.classList.add('reading'); }
}
function playFrom(i){
  if(!synth){ toast('Audio isn’t available in this browser.'); return; }
  const n=sentencesOf().length; if(i>=n){ stopPlayer(true); return; }
  PL.idx=i; PL.playing=true; const run=++PL.run;
  synth.cancel();
  const u=utter(sentenceText(i),PL.rate);
  u.onend=()=>{ if(PL.run!==run||!PL.playing) return; setTimeout(()=>{ if(PL.run===run&&PL.playing) playFrom(PL.idx+1); },350); };
  u.onerror=()=>{ if(PL.run===run){ PL.playing=false; syncPlayer(); } };
  synth.speak(u);
  syncPlayer();
  const el=document.querySelector(`#story .sent[data-s="${i}"]`);
  if(el){ const r=el.getBoundingClientRect(); if(r.top<80||r.bottom>innerHeight-130) el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
}
function stopPlayer(reset){
  if(!PL.playing&&!reset) return;
  PL.run++; PL.playing=false; if(synth) synth.cancel();
  if(reset) PL.idx=0;
  if(S.view==='reader') syncPlayer();
}
document.getElementById('pl-play').onclick=()=>{ if(PL.playing) stopPlayer(false); else playFrom(PL.idx); };
document.getElementById('pl-next').onclick=()=>{ const n=sentencesOf().length; const i=Math.min(PL.idx+1,n-1); PL.playing?playFrom(i):(PL.idx=i,syncPlayer()); };
document.getElementById('pl-prev').onclick=()=>{ const i=Math.max(PL.idx-1,0); PL.playing?playFrom(i):(PL.idx=i,syncPlayer()); };
document.getElementById('pl-rate').onclick=()=>{ PL.rate=RATES[(RATES.indexOf(PL.rate)+1)%RATES.length]; store.set('tw.rate',PL.rate); if(PL.playing) playFrom(PL.idx); else syncPlayer(); };
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,1800); }

/* ---------- Events ---------- */
let openedHere=false;
function goLibrary(){ if(S.view==='reader'&&openedHere){ openedHere=false; history.back(); return; } stopPlayer(true); S.view='library'; history.replaceState(null,'',location.pathname); render(); window.scrollTo(0,0); }
document.getElementById('tab-stories').onclick=goLibrary;
scrim.onclick=()=>{ if(Date.now()-lp.upAt<400) return; closeSheet(); }; document.getElementById('sheet-close').onclick=closeSheet;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!sheet.hidden) closeSheet(); });

function openWord(el){
  document.querySelectorAll('.w.on').forEach(e=>e.classList.remove('on')); el.classList.add('on');
  openSheet(wordSheet(el.dataset.k));
}
function openSentence(el){
  document.querySelectorAll('.sent.on').forEach(e=>e.classList.remove('on')); el.classList.add('on');
  openSheet(sentenceSheet(+el.dataset.s));
}

document.addEventListener('click',e=>{
  const t=e.target;
  const b=t.closest('button');
  if(b){
    if(b.dataset.mode){ S.mode=b.dataset.mode; store.set('tw.mode2',S.mode); render(); return; }
    if(b.dataset.go){ goLibrary(); return; }
    if(b.dataset.open){ openedHere=true; location.hash=b.dataset.open; return; }
    if(b.dataset.filter!=null){ S.filter=+b.dataset.filter; render(); return; }
    if(b.dataset.say){ speak(disp(b.dataset.say)); return; }
    if(b.dataset.sayText){ speak(b.dataset.sayText); return; }
    if(b.dataset.save){ const k=b.dataset.save;
      const st=STORIES.find(s=>s.id===S.story), d=D[k];
      const on=TW.saved.toggle({k,py:d[0],en:d[1],pos:d[2],lvl:d[3],note:d[4]||'',from:'story',src:'story',ref:S.story,title:st?st.zh:'',story:S.story});
      toast(on?'Added to Saved words':'Removed from Saved words');
      document.getElementById('saved-count').textContent=TW.saved.count();
      sheetBody.innerHTML=wordSheet(k); return; }
  }
  if(Date.now()-lp.upAt<400) return;
  const w=t.closest('#story .w'); if(w) openWord(w);
});
document.addEventListener('keydown',e=>{
  const w=e.target.closest&&e.target.closest('#story .w');
  if(w&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); openWord(w); }
});

/* long-press on a sentence */
const lp={t:null,fired:false,x:0,y:0,el:null,upAt:0};
function cancelLp(){ clearTimeout(lp.t); if(lp.el) lp.el.classList.remove('pressing'); lp.el=null; }
document.addEventListener('pointerdown',e=>{
  const s=e.target.closest('#story .sent'); if(!s) return;
  lp.fired=false; lp.x=e.clientX; lp.y=e.clientY; lp.el=s;
  clearTimeout(lp.t);
  lp.t=setTimeout(()=>{ s.classList.remove('pressing'); lp.fired=true; openSentence(s); try{navigator.vibrate&&navigator.vibrate(12)}catch(_){} },550);
  setTimeout(()=>{ if(lp.el===s&&!lp.fired) s.classList.add('pressing'); },150);
});
document.addEventListener('pointermove',e=>{ if(lp.el&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10) cancelLp(); });
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{ if(lp.fired){ lp.upAt=Date.now(); lp.fired=false; } cancelLp(); }));
document.addEventListener('contextmenu',e=>{ if(e.target.closest('#story')) e.preventDefault(); });

/* Open the story named in the link, e.g. …#typhoon (used by the Lessons app's Stories tab) */
function storyFromHash(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(STORIES.some(st=>st.id===h)){ S.story=h; S.view='reader'; return true; }
  if(h==='library'||!h){ S.view='library'; return true; }
  return false;
}
storyFromHash();
window.addEventListener('hashchange',()=>{ if(storyFromHash()){ stopPlayer(true); render(); window.scrollTo(0,0); } });
/* ---------- Shared app: settings and Saved Words kept in sync with the rest of the app ---------- */
TW.onSync(()=>{ S.mode=store.get('tw.mode2','py'); PL.rate=store.get('tw.rate',0.85); if(!PL.playing) render(); else document.getElementById('saved-count').textContent=TW.saved.count(); });
render();
</script>
